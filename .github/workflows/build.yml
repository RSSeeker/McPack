name: Build McPack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NativeAOT (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (native_hooks)
        run: cmake -B native_hooks/build -S native_hooks

      - name: Build native_hooks
        run: cmake --build native_hooks/build --config Release

      - name: Copy native_hooks libs (MSVC Release subdir -> build root)
        run: |
          Copy-Item native_hooks/build/Release/sfmc_hooks_static.lib native_hooks/build/sfmc_hooks_static.lib
          Copy-Item native_hooks/build/Release/sfmc_hooks_shared.dll native_hooks/build/sfmc_hooks_shared.dll -ErrorAction SilentlyContinue

      - name: Restore NUKE
        run: dotnet restore build/_build.csproj

      - name: Publish SingleFileMc (NativeAOT)
        run: dotnet publish SingleFileMc/SingleFileMc.csproj -c Release -r win-x64

      - name: Verify stub exists
        shell: pwsh
        run: |
          $stub = Get-ChildItem -Path SingleFileMc/bin -Recurse -Filter SingleFileMc.exe | Select-Object -First 1
          if ($stub) {
            Write-Host "Stub found: $($stub.FullName) ($($stub.Length) bytes)"
          } else {
            Write-Error "Stub not found anywhere under SingleFileMc/bin"
            Get-ChildItem SingleFileMc/bin -Recurse | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Generate StubData.g.cs
        shell: pwsh
        run: |
          $stub = Get-ChildItem -Path SingleFileMc/bin -Recurse -Filter SingleFileMc.exe | Select-Object -First 1
          if (-not $stub) { Write-Error "Stub not found"; exit 1 }
          $bytes = [IO.File]::ReadAllBytes($stub.FullName)
          $b64 = [Convert]::ToBase64String($bytes)
          $code = @"
          namespace SingleFileMc.Packager;
          internal static class StubData
          {
              internal static readonly byte[] Binary = System.Convert.FromBase64String(@"$b64");
          }
          "@
          $out = 'SingleFileMc.Packager\StubData.g.cs'
          [IO.File]::WriteAllText($out, $code)
          Write-Host "Generated $out ($($bytes.Length) bytes)"

      - name: Publish Packager (NativeAOT)
        run: dotnet publish SingleFileMc.Packager/SingleFileMc.Packager.csproj -c Release -r win-x64

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $launcher = Get-ChildItem -Path SingleFileMc/bin -Recurse -Filter SingleFileMc.exe | Select-Object -First 1
          $packager = Get-ChildItem -Path SingleFileMc.Packager/bin -Recurse -Filter SingleFileMc.Packager.exe | Select-Object -First 1
          if (-not $launcher) { Write-Error "SingleFileMc.exe not found" }
          if (-not $packager) { Write-Error "SingleFileMc.Packager.exe not found" }
          Copy-Item $launcher.FullName release/SingleFileMc.exe -Verbose
          Copy-Item $packager.FullName release/SingleFileMc.Packager.exe -Verbose
          Get-ChildItem release/

      - name: Create Pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: preview-${{ github.run_number }}
          tag_name: preview-${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/SingleFileMc.exe
            release/SingleFileMc.Packager.exe